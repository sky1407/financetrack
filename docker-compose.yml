services:
  db:
    image: postgres:16-alpine
    container_name: financetrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financetrack
      POSTGRES_PASSWORD: financetrack
      POSTGRES_DB: financetrack
    ports:
      - "5432:5432"
    volumes:
      - financetrack-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financetrack -d financetrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: financetrack-redis
    restart: unless-stopped
    # BullMQ requires noeviction, otherwise Redis may silently drop queued jobs under memory pressure.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  financetrack-db-data:
